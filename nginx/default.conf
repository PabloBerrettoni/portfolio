server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate with the browser (ETag/304) so deploys are picked
    # up immediately instead of serving stale cached assets
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ =404;
    }
}
